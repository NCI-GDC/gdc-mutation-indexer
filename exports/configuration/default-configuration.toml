[aws.s3]
access_key = ""
host = ""
secret_key = ""

[indexd]
host = "indexd.service.consul"
password = ""
port = 80
user = ""

[elasticsearch]
[elasticsearch.connection]
nodes = "localhost:9200"
password = ""
use_ssl = false
user = ""
verify_certs = true
[elasticsearch.read]
case_index = "graph_case"
file_index = "graph_file"
[elasticsearch.write]
batch_size_bytes = "16mb"
batch_size_entities = 1000
coalesce_size = 12
repartition_size = 2048
