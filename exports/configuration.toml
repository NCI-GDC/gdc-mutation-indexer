[environment]
java_home = ""
spark_home = ""
yarn_conf_dir = ""

[spark]
master = "yarn"

[spark.app]
name = "gdc_mutation_indexer"

[spark.driver]
max_result_size = "1g"
memory = "12g"

[spark.executor]
cores = 8
instances = 25
memory = "40g"

[spark.pyspark]
python = "./mutation-indexer.pex"
[spark.pyspark.driver]
python = "./mutation-indexer.pex"

[spark.sql]
auto_broadcast_join_threshold = -1
case_sensitive = true
[spark.sql.shuffle]
partitions = 1024

[spark.submit]
deploy_mode = "cluster"

[spark.yarn.app_master_env]
pex_python = "python3.6"
pex_root = '"./.pex"'

[spark.yarn.executor_env]
pex_python = "python3.6"
pex_root = '"./.pex"'

[build]
build_version = "v0"
config_file = "./.configs/test-config.toml"
data_release = "test"
index_types = [
  "CASE_CENTRIC",
  "CNV_CENTRIC",
  "CNV_OCCURRENCE_CENTRIC",
  "GENE_CENTRIC",
  "SSM_CENTRIC",
  "SSM_OCCURRENCE_CENTRIC",
  "GENE_EXPRESSION",
]
jar_dir = "artifacts/jars"
manifest_dir = "./.manifests"
projects = []
study_label = ""

[builders]
[builders.viz.ascat]
is_cached = true
omit_cnv_data = true
[builders.viz.ascat.backup]
mode = "NEITHER"
path = ""

[builders.viz.case]
excluded_fields = [
  "annotations",
  "case_autocomplete",
  "family_histories",
  "files",
  "follow_ups",
  "project.disease_type",
  "project.primary_site",
  "*_ids",
  "diagnoses.annotations",
  "*.updated_datetime",
  "*.created_datetime",
  "project.releasable",
  "project.released",
  "project.state",
  "samples.updated_datetime",
  "samples.shortest_dimension",
  "samples.freezing_method",
  "samples.biospecimen_laterality",
  "samples.tissue_type",
  "samples.created_datetime",
  "samples.intermediate_dimension",
  "samples.oct_embedded",
  "samples.tumor_code",
  "samples.is_ffpe",
  "samples.days_to_sample_procurement",
  "samples.sample_type_id",
  "samples.growth_rate",
  "samples.method_of_sample_procurement",
  "samples.preservation_method",
  "samples.pathology_report_uuid",
  "samples.longest_dimension",
  "samples.distributor_reference",
  "samples.tumor_code_id",
  "samples.catalog_reference",
  "samples.biospecimen_anatomic_site",
  "samples.state",
  "samples.time_between_excision_and_freezing",
  "samples.submitter_id",
  "samples.sample_id",
  "samples.time_between_clamping_and_freezing",
  "samples.sample_ordinal",
  "samples.annotations",
  "samples.days_to_collection",
  "samples.tumor_descriptor",
  "samples.distance_normal_to_tumor",
  "samples.current_weight",
  "samples.composition",
  "samples.tissue_collection_type",
  "samples.portions",
  "samples.initial_weight",
  "samples.diagnosis_pathologically_confirmed",
  "samples.passage_count",
  "exposures.exposure_type",
  "diagnoses.wilms_tumor_histologic_subtype",
  "exposures.alcohol_drinks_per_day",
  "exposures.parent_with_radiation_exposure",
  "diagnoses.tumor_confined_to_organ_of_origin",
  "diagnoses.best_overall_response",
  "exposures.type_of_tobacco_used",
  "diagnoses.tumor_focality",
  "exposures.secondhand_smoke_as_child",
  "diagnoses.irs_group",
  "exposures.type_of_smoke_exposure",
  "diagnoses.satellite_nodule_present",
  "diagnoses.cog_rhabdomyosarcoma_risk_group",
  "diagnoses.days_to_best_overall_response",
  "diagnoses.eln_risk_classification",
  "diagnoses.pathology_details.necrosis_present",
]
is_cached = true
repartition_size = 2048
[builders.viz.case.backup]
mode = "NEITHER"
path = ""

[builders.viz.gene_model]
census_file = "s3a://gdc-mutation-indexer/cancer_gene_census_set.tsv.gz"
citobands_file = "s3a://gdc-mutation-indexer/genes.cytobands.tsv.gz"
gene_model_file = "s3a://gdc-mutation-indexer/genes.hg38.v2.json"
is_cached = true
[builders.viz.gene_model.backup]
mode = "NEITHER"
path = ""

[builders.viz.maf_metadata]
is_cached = true
prioritized_experimental_strategies = [
  "WXS",
  "Targeted Sequencing",
]
[builders.viz.maf_metadata.backup]
mode = "NEITHER"
path = ""

[builders.viz.maf]
is_cached = true
repartition_size = 2048
[builders.viz.maf.backup]
mode = "NEITHER"
path = ""

[builders.viz.primary_aliquot]
is_cached = true
[builders.viz.primary_aliquot.backup]
mode = "NEITHER"
path = ""

[builders.viz.case_centric]
coalesce_size = 12
genes_threshold = 100
is_cached = true
repartition_size = 2048
[builders.viz.case_centric.backup]
mode = "NEITHER"
path = ""

[builders.viz.gene_centric]
coalesce_size = 12
is_cached = true
repartition_size = 2048
[builders.viz.gene_centric.backup]
mode = "NEITHER"
path = ""

[builders.viz.cnv_centric]
coalesce_size = 12
is_cached = true
occurrences_threshold = 100
repartition_size = 2048
[builders.viz.cnv_centric.backup]
mode = "NEITHER"
path = ""

[builders.viz.cnv_occurrence_centric]
coalesce_size = 12
is_cached = true
repartition_size = 2048
[builders.viz.cnv_occurrence_centric.backup]
mode = "NEITHER"
path = ""

[builders.viz.ssm_centric]
coalesce_size = 12
is_cached = true
occurrences_threshold = 100
repartition_size = 2048
[builders.viz.ssm_centric.backup]
mode = "NEITHER"
path = ""

[builders.viz.ssm_occurrence_centric]
coalesce_size = 12
is_cached = true
repartition_size = 2048
[builders.viz.ssm_occurrence_centric.backup]
mode = "NEITHER"
path = ""

[builders.gene_expression.gene_model]
census_file = "s3a://gdc-mutation-indexer/cancer_gene_census_set.tsv.gz"
citobands_file = "s3a://gdc-mutation-indexer/genes.cytobands.tsv.gz"
gene_model_file = "s3a://gdc-mutation-indexer/genes.hg38.v2.json"
is_cached = true
[builders.gene_expression.gene_model.backup]
mode = "NEITHER"
path = ""

[builders.gene_expression.value]
is_cached = true
[builders.gene_expression.value.backup]
mode = "NEITHER"
path = ""

[builders.gene_expression.case]
is_cached = true
[builders.gene_expression.case.backup]
mode = "NEITHER"
path = ""

[builders.gene_expression.primary_aliquot]
is_cached = true
[builders.gene_expression.primary_aliquot.backup]
mode = "NEITHER"
path = ""

[builders.gene_expression.gene_expression]
coalesce_size = 12
is_cached = true
repartition_size = 2048
[builders.gene_expression.gene_expression.backup]
mode = "NEITHER"
path = ""

[aws.s3]
access_key = ""
host = ""
secret_key = ""

[indexd]
host = "indexd.service.consul"
password = ""
port = 80
user = ""

[elasticsearch]
[elasticsearch.connection]
nodes = "localhost:9200"
password = ""
use_ssl = true
user = ""
verify_certs = false
[elasticsearch.read]
case_index = "graph_case"
file_index = "graph_file"
[elasticsearch.write]
batch_size_bytes = "16mb"
batch_size_entities = 1000
