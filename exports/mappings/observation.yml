properties:
  observation_id:
    type: keyword
  center:
    type: keyword
  input_bam_file:
    properties:
      normal_bam_uuid:
        type: keyword
      tumor_bam_uuid:
        type: keyword
  mutation_status:
    type: keyword
  normal_genotype:
    properties:
      match_norm_seq_allele2:
        type: keyword
        default: empty
      match_norm_seq_allele1:
        type: keyword
        default: empty
  read_depth:
    properties:
      n_depth:
        type: long
      n_alt_count:
        type: long
        default: empty
      n_ref_count:
        type: long
        default: empty
      t_alt_count:
        type: long
      t_depth:
        type: long
      t_ref_count:
        type: long
  sample:
    properties:
      matched_norm_sample_barcode:
        type: keyword
      matched_norm_sample_uuid:
        type: keyword
      tumor_sample_barcode:
        type: keyword
      tumor_sample_uuid:
        type: keyword
  src_vcf_id:
    type: keyword
  tumor_genotype:
    properties:
      tumor_seq_allele1:
        type: keyword
      tumor_seq_allele2:
        type: keyword
  validation:
    properties:
      tumor_validation_allele1:
        type: keyword
        default: empty
      tumor_validation_allele2:
        type: keyword
        default: empty
      match_norm_validation_allele1:
        type: keyword
        default: normal_allele1
        default: empty
      match_norm_validation_allele2:
        type: keyword
        default: normal_allele2
        default: empty
      validation_method:
        type: keyword
        default: empty
      validation_status:
        type: keyword
        default: empty
      verification_status:
        type: keyword
        default: empty
  variant_calling:
    properties:
      variant_process:
        type: keyword
      variant_caller:
        type: keyword
