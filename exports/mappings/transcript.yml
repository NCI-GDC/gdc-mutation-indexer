properties:
  aa_change:
    type: text
    fields:
      analyzed:
        type: text
        analyzer: id_search
      raw:
        type: keyword
        store: true
      search:
        type: text
        analyzer: id_search
  aa_end:
    type: long
  aa_start:
    type: long
  consequence_type:
    type: keyword
  gene_symbol:
    type: keyword
    default: symbol
  is_canonical:
    type: boolean
    default: empty
  ref_seq_accession:
    type: keyword
  transcript_id:
    type: keyword
    default: canonical_transcript_id
