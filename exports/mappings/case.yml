properties:
  available_variation_data:
    type: keyword 
  case_autocomplete:
      type: keyword
      fields:
        analyzed:
          type: text
          analyzer: autocomplete_analyzed
          search_analyzer: lowercase_keyword
        lowercase:
          type: text
          analyzer: lowercase_keyword
        prefix:
          type: text
          analyzer: autocomplete_prefix
          search_analyzer: lowercase_keyword
  state:
    type: keyword
    default: empty
  case_id:
    type: text
  demographic:
    properties:
      state:
        type: keyword
        default: empty
      demographic_id:
        type: keyword
      ethnicity:
        type: keyword
      gender:
        type: keyword
      race:
        type: keyword
      submitter_id:
        type: keyword
      created_datetime:
        type: date 
      updated_datetime:
        type: date
      year_of_birth:
        type: long
      year_of_death:
        type: long
  diagnoses:
    type: nested
    properties:
      state:
        type: keyword
        default: empty
      age_at_diagnosis:
        type: double
      classification_of_tumor:
        type: keyword
      days_to_birth:
        type: double
      days_to_death:
        type: double
      days_to_last_follow_up:
        type: double
      diagnosis_id:
        type: keyword
      last_known_disease_status:
        type: keyword
      morphology:
        type: keyword
        default: empty
      primary_diagnosis:
        type: keyword
      prior_malignancy:
        type: keyword
      progression_or_recurrence:
        type: keyword
      site_of_resection_or_biopsy:
        type: keyword
      submitter_id:
        type: keyword
      tissue_or_organ_of_origin:
        type: keyword
      tumor_grade:
        type: keyword
        default: empty
      tumor_stage:
        type: keyword
      updated_datetime:
        type: keyword
      created_datetime:
        type: keyword
      vital_status:
        type: keyword
  project:
    properties:
      disease_type:
        type: keyword
      name:
        type: keyword
      primary_site:
        type: keyword
      program:
        properties:
          dbgap_accession_number:
            type: keyword
          name:
            type: keyword
          program_id:
            type: keyword
      project_id:
        type: keyword
      released:
        type: boolean
      state:
        type: keyword
  submitter_id:
    type: keyword
  summary:
    properties:
      data_categories:
        type: nested
        properties:
          data_category:
            type: keyword
          file_count:
            type: long
  updated_datetime:
    type: date
  created_datetime:
    type: date 
    default: empty
