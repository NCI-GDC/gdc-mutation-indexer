[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 61", "wheel", "setuptools_scm[toml]", "versionista"]

[project]
authors = [{name = "NCI GDC", email = "support@nci-gdc.datacommons.io"}]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python"
]
dependencies = [
  "boto3",
  "boto3-stubs[s3]",
  "elasticsearch[async]~=7.6",
  "marshmallow-dataclass~=8.5",
  "marshmallow-enum~=1.5",
  "more-itertools~=8.9",
  "numpy",
  "pyspark~=3.3.1",
  "python-json-logger~=2.0",
  "gdcmodels",
  "indexclient",
  "mutation-indexer-resource @ git+ssh://git@github.com/NCI-GDC/mutation-indexer-resource.git@1.0.0",
  "toml~=0.10",
  "typing-extensions~=4.1"
]
description = "ETL for mutation elasticsearch indices"
dynamic = ["version"]
license = {file = "LICENSE"}
name = "gdc-mutation-indexer"
requires-python = "~=3.9"

[project.optional-dependencies]
client = ["halo", "pex", "wheel"]
dev = [
  "click~=8.1",
  "coverage[toml]~=7.0",
  "deepdiff~=6.0",
  "pytest~=8.0",
  "pytest-cov~=4.0"
]

[project.scripts]
mutation-indexer = "mutation_indexer.client:main [client]"

[project.urls]
repository = "https://github.com/NCI-GDC/gdc-mutation-indexer"

[tool.isort]
known_first_party = ["mutation_indexer"]
multi_line_output = 3
profile = "black"

[tool.mypy]
plugins = ["marshmallow_dataclass.mypy"]

[tool.pytest.ini_options]
addopts = "-rflv"
markers = [
  "do_not_collect",
  "gistic_build",
  "ssm_occurrence_centric_ssm_subtree",
  "gistic_combine",
  "gene_centric_ssm_subtree",
  "cnv_occurrence_centric_cnv_subtree",
  "case_centric_ssm_subtree"
]
minversion = "6.0"
testpaths = ["tests/unit", "tests/integration"]

[tool.setuptools_scm]
local_scheme = "versionista-local-format"
version_scheme = "versionista-format"
