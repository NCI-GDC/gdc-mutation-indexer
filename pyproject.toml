[tool.isort]
known_first_party = ["exports"]
multi_line_output = 3
profile = "black"

[tool.pytest.ini_options]
addopts = "-rflv"
markers = [
  "do_not_collect",
  "gistic_build",
  "ssm_occurrence_centric_ssm_subtree",
  "gistic_combine",
  "gene_centric_ssm_subtree",
  "cnv_occurrence_centric_cnv_subtree",
  "case_centric_ssm_subtree",
]
minversion = "6.0"
testpaths = [
  "tests",
]
