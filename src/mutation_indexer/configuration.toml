[build]
acl = ["open"]
error_log = "/spark/host/mutation-indexer-error.log"
jar_dir = "/spark/jars"
manifest_dir = "/spark/host/manifests"
output_log = "/spark/host/mutation-indexer.log"
projects = []
spark_submit = "$SPARK_HOME/bin/spark-submit"
study_label = ""

[spark]
master = "yarn"

[spark.app]
name = "gdc_mutation_indexer"

[spark.driver]
max_result_size = "0"
memory = "32g"

[spark.executor]
cores = 12
instances = 24
memory = "24g"

[spark.executor_env]
UV_PYTHON = "3.13"

[spark.pyspark]
python = "'uv run --script'"

[spark.pyspark.driver]
python = "'uv run --script'"

[spark.sql]
auto_broadcast_join_threshold = -1
case_sensitive = true

[spark.sql.shuffle]
partitions = 1024

[spark.submit]
deploy_mode = "cluster"

[spark.yarn.app_master_env]
UV_PYTHON = "3.13"
