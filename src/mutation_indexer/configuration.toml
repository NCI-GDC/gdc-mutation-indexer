[build]
acl = ["open"]
driver = "$MUTATION_INDEXER/driver.py"
error_log = "$HOME/mutation-indexer-error.log"
index_types = [
  "CASE_CENTRIC",
  "CNV_CENTRIC",
  "CNV_OCCURRENCE_CENTRIC",
  "GENE_CENTRIC",
  "SEGMENT_CNV_CENTRIC",
  "SEGMENT_CNV_OCCURRENCE_CENTRIC",
  "SSM_CENTRIC",
  "SSM_OCCURRENCE_CENTRIC"
]
jar_dir = "$MUTATION_INDEXER/jars"
manifest_dir = "$HOME/manifests"
output_log = "$HOME/mutation-indexer.log"
pex_file = "$MUTATION_INDEXER/driver-all"
projects = []
spark_submit = "$SPARK_HOME/bin/spark-submit"
study_label = ""

[builders]

[builders.gene_expression.case]
is_cached = true

[builders.gene_expression.case.backup]
mode = "NEITHER"
path = ""

[builders.gene_expression.expression_value]
is_cached = true

[builders.gene_expression.expression_value.backup]
mode = "NEITHER"
path = ""

[builders.gene_expression.gene_expression]
id_field = "gene_expression_id"
is_cached = false
partition_size = 12

[builders.gene_expression.gene_expression.backup]
mode = "NEITHER"
partition_by = "gene_id"
path = ""

[builders.gene_expression.gene_model]
census_file = "s3a://$MUTATION_INDEXER_BUCKET/cancer_gene_census_set.gencode_v36.tsv.gz"
citobands_file = "s3a://$MUTATION_INDEXER_BUCKET/gencode.v36.cytoband.par_removed.formated.tsv.gz"
gene_model_file = "s3a://$MUTATION_INDEXER_BUCKET/genes.hg38.ensembl102.gencode36.json"
is_cached = true

[builders.gene_expression.gene_model.backup]
mode = "NEITHER"
path = ""

[builders.gene_expression.primary_aliquot]
is_cached = false

[builders.gene_expression.primary_aliquot.backup]
mode = "NEITHER"
path = ""

[builders.viz.ascat]
is_cached = false
omit_cnv_data = false

[builders.viz.ascat.backup]
mode = "BOTH"
path = "s3a://$MUTATION_INDEXER_BUCKET/backups/ascat.parqet"

[builders.viz.ascat_metadata]
is_cached = true

[builders.viz.ascat_metadata.backup]
mode = "NEITHER"
path = ""

[builders.viz.case]
include_as_arrays = [
  "aliquot_ids",
  "analyte_ids",
  "diagnoses.pathology_details.tumor_level_prostate",
  "diagnoses.sites_of_involvement",
  "diagnoses.treatments.route_of_administration",
  "diagnoses.treatments.treatment_anatomic_sites",
  "diagnoses.weiss_assessment_findings",
  "diagnosis_ids",
  "exposures.chemical_exposure_type",
  "exposures.occupation_type",
  "files.acl",
  "follow_ups.comorbidities",
  "follow_ups.imaging_anatomic_site",
  "follow_ups.other_clinical_attributes.comorbidities",
  "follow_ups.other_clinical_attributes.risk_factors",
  "follow_ups.other_clinical_attributes.viral_hepatitis_serology_tests",
  "follow_ups.risk_factors",
  "follow_ups.viral_hepatitis_serology_tests",
  "portion_ids",
  "project.disease_type",
  "project.primary_site",
  "sample_ids",
  "slide_ids",
  "submitter_aliquot_ids",
  "submitter_analyte_ids",
  "submitter_diagnosis_ids",
  "submitter_portion_ids",
  "submitter_sample_ids",
  "submitter_slide_ids"
]
is_cached = true
repartition_size = 2048

[builders.viz.case.backup]
mode = "NEITHER"
path = ""

[builders.viz.case_centric]
genes_threshold = 100
id_field = "case_id"
include_as_arrays = [
  "aliquot_ids",
  "analyte_ids",
  "diagnoses.pathology_details.tumor_level_prostate",
  "diagnoses.sites_of_involvement",
  "diagnoses.treatments.route_of_administration",
  "diagnoses.treatments.treatment_anatomic_sites",
  "diagnoses.weiss_assessment_findings",
  "diagnosis_ids",
  "exposures.chemical_exposure_type",
  "exposures.occupation_type",
  "files.acl",
  "follow_ups.comorbidities",
  "follow_ups.imaging_anatomic_site",
  "follow_ups.other_clinical_attributes.comorbidities",
  "follow_ups.other_clinical_attributes.risk_factors",
  "follow_ups.other_clinical_attributes.viral_hepatitis_serology_tests",
  "follow_ups.risk_factors",
  "follow_ups.viral_hepatitis_serology_tests",
  "portion_ids",
  "project.disease_type",
  "project.primary_site",
  "sample_ids",
  "slide_ids",
  "submitter_aliquot_ids",
  "submitter_analyte_ids",
  "submitter_diagnosis_ids",
  "submitter_portion_ids",
  "submitter_sample_ids",
  "submitter_slide_ids"
]
is_cached = false
partition_size = 12

[builders.viz.case_centric.backup]
mode = "NEITHER"
path = ""

[builders.viz.civic_dna]
is_cached = false
package = "mutation_indexer_resource.annotation.civic"
resource = "dna.tsv.gz"
schema = "builders/civic/dna.yaml"

[builders.viz.civic_dna.backup]
mode = "NEITHER"
path = ""

[builders.viz.civic_protein]
is_cached = false
package = "mutation_indexer_resource.annotation.civic"
resource = "prot.tsv.gz"
schema = "builders/civic/protein.yaml"

[builders.viz.civic_protein.backup]
mode = "NEITHER"
path = ""

[builders.viz.cnv_centric]
id_field = "cnv_id"
is_cached = false
occurrences_threshold = 100
partition_size = 12

[builders.viz.cnv_centric.backup]
mode = "NEITHER"
path = ""

[builders.viz.cnv_occurrence_centric]
id_field = "cnv_occurrence_id"
is_cached = false
partition_size = 12

[builders.viz.cnv_occurrence_centric.backup]
mode = "NEITHER"
path = ""

[builders.viz.gene_centric]
id_field = "gene_id"
is_cached = false
partition_size = 12

[builders.viz.gene_centric.backup]
mode = "NEITHER"
path = ""

[builders.viz.gene_model]
census_file = "s3a://$MUTATION_INDEXER_BUCKET/cancer_gene_census_set.gencode_v36.tsv.gz"
citobands_file = "s3a://$MUTATION_INDEXER_BUCKET/gencode.v36.cytoband.par_removed.formated.tsv.gz"
gene_model_file = "s3a://$MUTATION_INDEXER_BUCKET/genes.hg38.ensembl102.gencode36.json"
is_cached = true

[builders.viz.gene_model.backup]
mode = "NEITHER"
path = ""

[builders.viz.maf]
is_cached = true
repartition_size = 2048

[builders.viz.maf.backup]
mode = "BOTH"
path = "s3a://$MUTATION_INDEXER_BUCKET/backups/maf.parqet"

[builders.viz.maf_metadata]
is_cached = true
prioritized_experimental_strategies = ["WXS", "Targeted Sequencing"]

[builders.viz.maf_metadata.backup]
mode = "NEITHER"
path = ""

[builders.viz.primary_aliquot]
is_cached = false

[builders.viz.primary_aliquot.backup]
mode = "NEITHER"
path = ""

[builders.viz.segment_cnv]
is_cached = false

[builders.viz.segment_cnv.backup]
mode = "BOTH"
path = "s3a://$MUTATION_INDEXER_BUCKET/backups/segment_cnv.parqet"

[builders.viz.segment_cnv_centric]
id_field = "segment_cnv_id"
is_cached = false
partition_size = 12

[builders.viz.segment_cnv_centric.backup]
mode = "NEITHER"
path = ""

[builders.viz.segment_cnv_metadata]
is_cached = true
use_deprecated_query = true

[builders.viz.segment_cnv_metadata.backup]
mode = "NEITHER"
path = ""

[builders.viz.segment_cnv_occurrence_centric]
id_field = "segment_cnv_occurrence_id"
is_cached = false
partition_size = 12

[builders.viz.segment_cnv_occurrence_centric.backup]
mode = "NEITHER"
path = ""

[builders.viz.ssm_centric]
id_field = "ssm_id"
is_cached = false
occurrences_threshold = 100
partition_size = 12

[builders.viz.ssm_centric.backup]
mode = "NEITHER"
path = ""

[builders.viz.ssm_occurrence_centric]
id_field = "ssm_occurrence_id"
is_cached = false
partition_size = 12

[builders.viz.ssm_occurrence_centric.backup]
mode = "NEITHER"
path = ""

[elasticsearch.read]
case_index = "graph_case"
file_index = "graph_file"
max_source_filter_length = 400

[elasticsearch.write]
batch_size_bytes = "16mb"
batch_size_entries = 1000

[spark]
master = "yarn"

[spark.app]
name = "gdc_mutation_indexer"

[spark.driver]
max_result_size = "0"
memory = "32g"

[spark.executor]
cores = 12
instances = 24
memory = "24g"

[spark.pyspark]
python = "./python"

[spark.pyspark.driver]
python = "./python"

[spark.sql]
auto_broadcast_join_threshold = -1
case_sensitive = true

[spark.sql.shuffle]
partitions = 1024

[spark.submit]
deploy_mode = "cluster"

[spark.yarn.app_master_env]
tmpdir = "$TMPDIR"
xdg_cache_home = "$SPARK_HOME/.cache"

[spark.yarn.executor_env]
tmpdir = "$TMPDIR"
xdg_cache_home = "$SPARK_HOME/.cache"
