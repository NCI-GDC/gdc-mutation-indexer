[build]
acl = ["open"]
jar_dir = "jars"
logging = "conf/mutation-indexer/logging.toml"
manifest_dir = "$HOME/manifests"
projects = []
spark_submit = "$SPARK_HOME/bin/spark-submit"
study_label = ""

[spark]
master = "yarn"
executor_env = {}

[spark.app]
name = "mutation-indexer"

[spark.driver]
max_result_size = "0"
memory = "32g"

[spark.executor]
cores = 12
instances = 24
memory = "24g"

[spark.pyspark]
python = "uv-run"

[spark.pyspark.driver]
python = "uv-run"

[spark.sql]
auto_broadcast_join_threshold = -1
case_sensitive = true

[spark.sql.shuffle]
partitions = 1024

[spark.submit]
deploy_mode = "cluster"

[spark.yarn]
app_master_env = {}
