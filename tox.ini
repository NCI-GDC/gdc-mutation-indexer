[tox]
minversion = 3.4.0
envlist = py36
skip_missing_interpreters = true

[testenv]
usedevelop = true
deps =
    -rrequirements.txt
    -rdev-requirements.txt
    -rmaster-requirements.txt
install_command = python -m pip install --no-deps {opts} {packages}

[testenv:unit-py{36}]
commands =
    coverage run --source=exports -pm pytest {posargs: --workers auto --tests-per-worker auto tests/unit}

[testenv:integration-py{36}]
passenv =
    BOTO_CONFIG
    ES_VERSION
    SPARK_HOME
    JAVA_HOME
setenv =
    ES_VERSION = {env:ES_VERSION:7.7.1}
allowlist_externals =
    bash
commands_pre =
    bash ./spark-install.sh
commands =
    pytest -vv {posargs: -m 'not do_not_collect' tests/integration}
