[tox]
minversion = 3.4.0
envlist = py35
skip_missing_interpreters = true

[pytest]
minversion = 5.0
addopts = -rflv
testpaths =
    tests

[testenv]
usedevelop = true
deps =
    -rrequirements.txt
    -rdev-requirements.txt
commands =
    python -m pytest -vvv -m 'not do_not_collect' --cov=gdc-mutation-indexer --cov-report xml --cov-report term
