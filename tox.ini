[tox]
minversion = 3.4.0
envlist = unit-py{36,37}, integration-py{36,37}
skip_missing_interpreters = true

[testenv]
passenv =
    BOTO_CONFIG
    ES_VERSION
    SPARK_HOME
    PYTHONPATH

usedevelop = true
deps =
    -rrequirements.txt
    -rdev-requirements.txt
    -rmaster-requirements.txt
install_command = python -m pip install --no-deps {opts} {packages}

[testenv:unit-py{36,37}]
commands =
    pytest -vv {posargs: --cov=mutation_indexer --cov-report xml --cov-report term tests/unit}

[testenv:integration-py{36,37}]
commands = 
    pytest -vv {posargs: tests/integration}
