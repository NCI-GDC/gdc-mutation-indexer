[tox]
minversion = 3.4.0
envlist = py36
skip_missing_interpreters = true

[testenv]
passenv =
    BOTO_CONFIG
    ES_VERSION
    SPARK_HOME

usedevelop = true
deps =
    -rrequirements.txt
    -rdev-requirements.txt
    -rmaster-requirements.txt
install_command = python -m pip install --no-deps {opts} {packages}
whitelist_externals =
    bash
commands =
    bash run-tests.sh
