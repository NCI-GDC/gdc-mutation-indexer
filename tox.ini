[tox]
minversion = 3.4.0
envlist = py35
skip_missing_interpreters = true

[pytest]
minversion = 5.0
addopts = -rflv
testpaths =
    tests

[testenv]
passenv =
    ES_VERSION
    SPARK_HOME

usedevelop = true
deps =
    -rrequirements.txt
    -rdev-requirements.txt
install_command = python -m pip install --no-deps {opts} {packages}
whitelist_externals =
    bash
commands =
    bash run-tests.sh
