[tox]
minversion = 3.4.0
envlist = py{39,310}
skip_missing_interpreters = true

[testenv]
passenv =
    BOTO_CONFIG
    ES_VERSION
    SPARK_HOME
    JAVA_HOME
setenv =
    ES_VERSION = {env:ES_VERSION:7.7.1}
skip_install = true
install_command = python -m pip install --no-deps {opts} {packages}
allowlist_externals =
    bash
    poetry
commands_pre =
    bash ./bin/spark-install.sh
    poetry install --with dev
commands =
    pytest -vv {posargs: -m 'not do_not_collect' --cov=exports --cov-report xml --cov-report term}
