[environment]
java_home = ""
spark_home = ""
yarn_conf_dir = ""

[spark]
master = "local[*]"

[spark.app]
name = "gdc_mutation_indexer"

[spark.driver]
max_result_size = "1g"
memory = "12g"

[spark.executor]
cores = 8
instances = 25
memory = "40g"

[spark.pyspark]
python = "./mutation-indexer.pex"
[spark.pyspark.driver]
python = "./mutation-indexer.pex"

[spark.sql]
auto_broadcast_join_threshold = -1
case_sensitive = true
[spark.sql.shuffle]
partitions = 200

[spark.submit]
deploy_mode = "cluster"

[spark.yarn.app_master_env]
pex_python = "python3.9"
pex_root = "/mnt/tmp/.pex"
tmpdir = "/mnt/tmp"

[spark.yarn.executor_env]
pex_python = "python3.9"
pex_root = "/mnt/tmp/.pex"
tmpdir = "/mnt/tmp"

[build]
build_version = "v0"
config_file = "./.configs/test-config.toml"
data_release = "test"
index_types = [
  "CASE_CENTRIC",
  "CNV_CENTRIC",
  "CNV_OCCURRENCE_CENTRIC",
  "GENE_CENTRIC",
  "SSM_CENTRIC",
  "SSM_OCCURRENCE_CENTRIC",
]
jar_dir = "artifacts/jars"
manifest_dir = "./.manifests"
projects = []
study_label = ""

[builders]
[builders.gene_model]
census_file = "s3a://gdc-mutation-indexer/cancer_gene_census_set.tsv.gz"
citobands_file = "s3a://gdc-mutation-indexer/genes.cytobands.tsv.gz"
gene_model_file = "s3a://gdc-mutation-indexer/genes.hg38.v2.json"
is_cached = true
[builders.gene_model.backup]
mode = "NEITHER"
path = ""

[builders.expression_value]
is_cached = true
[builders.expression_value.backup]
mode = "NEITHER"
path = ""

[builders.case]
is_cached = true
[builders.case.backup]
mode = "NEITHER"
path = ""

[builders.primary_aliquot]
is_cached = true
[builders.primary_aliquot.backup]
mode = "NEITHER"
path = ""

[builders.gene_expression]
id_field = "case_id"
is_cached = true
partition_size = 12
[builders.gene_expression.backup]
mode = "NEITHER"
path = ""

[aws.s3]
access_key = ""
host = ""
secret_key = ""

[indexd]
host = "indexd.service.consul"
password = ""
port = 80
user = ""

[elasticsearch]
[elasticsearch.connection]
nodes = "http://localhost:9200"
password = ""
use_ssl = false
user = ""
verify_certs = false
[elasticsearch.read.indices]
file_index = "graph_file"
[elasticsearch.write]
batch_size_bytes = "16mb"
batch_size_entries = 1000
indices = {}
