---
settings:
  index:
    refresh_interval: 1m
    number_of_shards: 12
    number_of_replicas: 0
    mapping.total_fields.limit: 2000
  analysis:
    analyzer:
      autocomplete_analyzed:
        filter:
          - lowercase
          - edge_ngram
        tokenizer: standard
      autocomplete_prefix:
        filter:
          - lowercase
          - edge_ngram
        tokenizer: keyword
      lowercase_keyword:
        filter:
          - lowercase
        tokenizer: keyword
    filter:
      edge_ngram:
        max_gram: "20"
        min_gram: "1"
        side: front
        type: edge_ngram
    normalizer:
      clinical_normalizer:
        type: custom
        char_filter: []
        filter:
          - lowercase
  index.mapping.nested_fields.limit: 100
  index.mapping.nested_objects.limit: 100000000
  index.max_result_window: 100000000
mappings:
  _size:
    enabled: true
  _source:
    excludes:
      - gene.*
  properties:
    available_variation_data:
      type: keyword
      normalizer: clinical_normalizer
    case_autocomplete:
      fields:
        analyzed:
          analyzer: autocomplete_analyzed
          search_analyzer: lowercase_keyword
          type: text
        lowercase:
          analyzer: lowercase_keyword
          type: text
        prefix:
          analyzer: autocomplete_prefix
          search_analyzer: lowercase_keyword
          type: text
      type: keyword
      normalizer: clinical_normalizer
    case_id:
      copy_to:
        - case_autocomplete
      type: keyword
      normalizer: clinical_normalizer
    gene:
      properties:
        gene_id:
          type: keyword
    project:
      properties:
        project_id:
          copy_to:
            - case_autocomplete
          type: keyword
    samples:
      properties:
        sample_type:
          type: keyword
          normalizer: clinical_normalizer
  dynamic: strict
