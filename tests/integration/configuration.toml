[build]
build_version = "v0"
config_file = ""
jar_dir = "jars"
data_release = "test"
manifest_dir = "manifests"

[elasticsearch.connection]
nodes = "localhost"
user = ""
password = ""
use_ssl = false
verify_certs = false

[indexd]
host = "localhost"
port = 80
user = ""
password = ""

[spark]
master = "local[*]"

[spark.driver]
memory = "2g"

[spark.executor]
cores = 1
instances = 4
memory = "512m"

[spark.sql.shuffle]
partitions = 1

[spark.submit]
deploy_mode = "client"
