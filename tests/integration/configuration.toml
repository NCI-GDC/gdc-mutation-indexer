[build]
build_version = "v0"
config_file = ""
data_release = "test"
driver = "bin/driver.py"
error_log = "mutation-indexer-error.log"
jar_dir = "jars"
manifest_dir = "manifests"
output_log = "mutation-indexer.log"

[elasticsearch.connection]
nodes = "localhost"
password = ""
use_ssl = false
user = ""
verify_certs = false

[indexd]
host = "localhost"
password = ""
port = 80
user = ""

[spark]
master = "local[*]"

[spark.driver]
memory = "2g"

[spark.executor]
cores = 1
instances = 4
memory = "512m"

[spark.sql.shuffle]
partitions = 1

[spark.submit]
deploy_mode = "client"
