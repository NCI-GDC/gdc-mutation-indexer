string_type: &string_type
  class_name: StringType

expected_data:
  - ["case", "case-1", "case-1", "file-2", "WXG", "a-2"] # selected based on file_id, since the date and sample_type match
  - ["case", "case-2", "case-2", "file-4", "WSG", "a-4"] # the only file for "case-2"
  - ["case", "case-3", "case-3", "file-6", "Targeted Sequencing", "a-6"] # has an earlier creation date compared to "file-5"
  - ["case", "case-4", "case-4", "file-8", "WXG", "a-8a"] # older by one nano second.
  - ["file", "file-1", "case-1", "file-1", "Targeted Sequencing", "a-1"]
  - ["file", "file-2", "case-1", "file-2", "WXG", "a-2"]
  - ["file", "file-3", "case-1", "file-3", "Targeted Sequencing", null]
  - ["file", "file-4", "case-2", "file-4", "WSG", "a-4"]
  - ["file", "file-5", "case-3", "file-5", "WSG", "a-5"]
  - ["file", "file-6", "case-3", "file-6", "Targeted Sequencing", "a-6"]
  - ["file", "file-7", "case-4", "file-7", "Targeted Sequencing", "a-7"]
  - ["file", "file-8", "case-4", "file-8", "WXG", "a-8a"]

expected_es_include_fields: true

expected_es_query:
  query:
    bool:
      must:
        - nested:
            path: cases
            query:
              terms:
                cases.project.project_id:
                  - TEST0

expected_schema:
  - name: entity
    dataType: *string_type
  - name: entity_id
    dataType: *string_type
  - name: file_id
    dataType: *string_type
  - name: experimental_strategy
    dataType: *string_type
  - name: case_id
    dataType: *string_type
  - name: aliquot_id
