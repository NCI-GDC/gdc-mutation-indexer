expected_es_include_fields:
  - file_id
  - created_datetime
  - experimental_strategy
  - cases.case_id
  - cases.samples.sample_id
  - cases.samples.sample_type
  - cases.submitter_id
  - cases.demographic.days_to_death
  - cases.demographic.ethnicity
  - cases.demographic.gender
  - cases.demographic.race
  - cases.demographic.vital_status
  - cases.project.project_id
  - cases.diagnoses.age_at_diagnosis

expected_es_query:
  query:
    bool:
      must:
        - terms:
            data_type:
              - Gene Expression Quantification
        - terms:
            acl:
              - open
        - terms:
            analysis.workflow_type:
              - type0
              - type1
        - nested:
            path: cases
            query:
              terms:
                cases.project.project_id:
                  - TEST0
                  - TEST1

expected_schema:
  - name: file_id
    dataType: *string_type
  - name: file_url
    dataType: *string_type
  - name: case_id
    dataType: *string_type
  - name: submitter_id
    dataType: *string_type
  - name: demographic
    dataType:
      <<: *struct_type
      fields:
        - name: days_to_death
          dataType: *integer_type
        - name: ethnicity
          dataType: *string_type
        - name: gender
          dataType: *string_type
        - name: race
          dataType: *string_type
        - name: vital_status
          dataType: *string_type
  - name: project
    dataType:
      <<: *struct_type
      fields:
        - name: project_id
          dataType: *string_type
  - name: diagnoses
    dataType:
      <<: *array_type
      elementType:
        <<: *struct_type
        fields:
          - name: age_at_diagnosis
            dataType: *integer_type
  - name: samples
    dataType:
      <<: *array_type
      elementType:
        <<: *struct_type
        fields:
          - name: sample_id
            dataType: *string_type
          - name: sample_type
            dataType: *string_type
