---
fields:
  - &string_field
    metadata: {}
    name: did
    nullable: true
    type: string
  - <<: *string_field
    name: gene_id
  - <<: *string_field
    name: gene_name
  - <<: *string_field
    name: gene_type
  - &long_field
    metadata: {}
    name: unstranded
    nullable: true
    type: long
  - <<: *long_field
    name: stranded_first
  - <<: *long_field
    name: stranded_second
  - &double_field
    metadata: {}
    name: tpm_unstranded
    nullable: true
    type: double
  - <<: *double_field
    name: fpkm_unstranded
  - <<: *double_field
    name: fpkm_uq_unstranded
